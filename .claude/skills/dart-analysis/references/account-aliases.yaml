# 계정명 별칭 매핑 (dart-analysis)
# ─────────────────────────────────────────────────────────────────
# DART 재무제표의 account_nm(계정명)은 회사·연도·표준양식에 따라 표기가 흔들림.
# ratios.yaml의 표준 계정명 ← 실제로 등장하는 표기 변형들을 매핑.
# analyze.py가 수집된 계정명을 표준명으로 정규화할 때 사용.
#
# ⚠️ 1단계에서 실제 수집 데이터로 검증하며 계속 보강할 것(아래는 1차 후보).
#    매칭 실패 계정은 분석 시 ⚠️로 표면화하고, 확인 후 여기에 추가.

aliases:
  # ── 손익계산서 ──
  매출액:        [매출액, "수익(매출액)", 영업수익, 매출, 매출및지분법손익]
  매출원가:      [매출원가, 영업비용]
  영업이익:      [영업이익, "영업이익(손실)", 영업손익]
  당기순이익:    [당기순이익, "당기순이익(손실)", 분기순이익, 반기순이익, 연결당기순이익, "당기순이익(손실)지배기업소유주지분"]
  이자비용:      [이자비용, 금융원가, 이자비용및유사비용, 금융비용]

  # ── 재무상태표 ──
  자산총계:      [자산총계]
  부채총계:      [부채총계]
  자본총계:      [자본총계, "자본총계(지배+비지배)", 자본]
  유동자산:      [유동자산]
  유동부채:      [유동부채]

  # ── 현금흐름표 ──
  영업활동현금흐름: [영업활동현금흐름, 영업활동으로인한현금흐름, 영업활동순현금흐름, "영업활동으로부터의현금흐름"]

# 매칭 정책(analyze.py 참고):
#   1) 표준명 후보 리스트와 정확 일치 우선
#   2) 공백·괄호 제거 후 재시도
#   3) 그래도 실패 시 해당 비율을 '계산 불가(⚠️ 계정 매칭 실패)'로 표시 — 임의 추정 금지
