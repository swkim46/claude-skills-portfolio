# 사업부문(세그먼트) 별칭 매핑 → canonical 부문명 · dart-analysis v2
# ─────────────────────────────────────────────────────────────────
# parse_notes/notes_from_input가 뽑은 부문 raw명을 canonical 부문으로 정규화할 때
# compare.py(segments 블록)가 사용. --segment-focus <canonical>로 특정 부문만 격리 비교 가능.
#
# 매칭: raw 부문명에 별칭 토큰이 포함되면 그 canonical로 귀속(부분일치, 파일 순서 우선).
# 안 걸리면 raw명을 그대로 부문으로 유지(부문 표시는 되되 canonical 비교에선 제외, 표면화).
#
# ⚠️ seed 수준(편의점 비교용). 회사·산업마다 부문 정의가 다르므로 실데이터로 보강할 것.
#    같은 'canonical'이라도 회사별 부문 범위가 다를 수 있음(비교 시 caveat).

aliases:
  편의점:   [편의점, CVS, GS25, 씨유, 세븐일레븐, 미니스톱]
  슈퍼마켓: [슈퍼, 수퍼, SSM]
  홈쇼핑:   [홈쇼핑, TV쇼핑]
  HnB:      [H&B, 헬스앤뷰티, 랄라블라, 올리브영]
  호텔:     [호텔, 리조트]
  기타유통: [개발, 기타]
