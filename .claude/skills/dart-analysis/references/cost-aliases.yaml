# 비용 항목 별칭 매핑 (판매비와관리비 명세 → 표준 비용범주) · dart-analysis v2
# ─────────────────────────────────────────────────────────────────
# parse_notes/notes_from_input가 뽑은 판관비 raw 항목명을 표준 비용범주로 묶을 때
# compare.py(cost_structure 블록)가 사용.
#
# ⚠️ account-aliases와 다른 점 2가지:
#   1) 한 범주에 여러 raw 항목이 매칭되면 **합산**한다(범주 = 매칭 항목들의 합).
#      예: 급여 + 퇴직급여 + 복리후생비 → 인건비.
#   2) 매칭은 **부분일치(별칭 토큰이 raw 항목명에 포함)** + **파일 순서 우선순위**.
#      위에 적힌 범주가 먼저 잡힘 → 모호한 항목은 위쪽에 배치(예: 사용권자산상각비는
#      '임차료'로 잡아야 하므로 감가상각비보다 위에 둠).
#   매칭 안 된 항목은 '기타'로 합산하고 unmatched로 표면화(임의 추정 금지).

aliases:
  인건비:    [급여, 임금, 종업원급여, 퇴직급여, 상여, 복리후생비, 잡급]
  지급수수료: [지급수수료, 수수료비용, 수수료]   # 전산수수료·인건비성수수료 등 수수료류 포괄
  임차료:    [임차료, 지급임차료, 사용권자산상각비, 사용권자산감가상각비]   # IFRS16: 임차료 상당이 사용권자산 상각으로 이동(주의)
  감가상각비: [감가상각비, 무형자산상각비]
  광고판촉:   [광고선전비, 판매촉진비, 광고비, 판촉비]
  운반물류:   [운반비, 보관료, 물류비, 포장비]
  연구개발:   [경상연구개발비, 연구개발비, 경상개발비]
  세금공과:   [세금과공과, 제세공과금]
  소모품여비: [소모품비, 여비교통비, 통신비, 도서인쇄비]

# 매칭 정책(compare.py 참고):
#   1) raw 항목명 공백 제거 후, 위 범주를 순서대로 보며 별칭 토큰이 포함되면 그 범주로 귀속(합산)
#   2) 어느 범주에도 안 걸리면 '기타'로 합산하고 unmatched 목록에 기록(표면화)
