# 증권업 전용 계정 별칭 (dart-analysis-code · securities profile)
# ─────────────────────────────────────────────────────────────────
# analyze.py --aliases <이 파일> 로 선택. 분석 엔진(analyze.py)은 dart-analysis와 공유하므로
# **엔진을 건드리지 않으려고 영업수익을 표준명 '매출액'으로 fold**한다 → 엔진 기본값
# CORE/KEY_AMT(매출액·영업이익)가 그대로 통과하고, ratios-securities의 분모도 매출액(=영업수익)으로 잡힘.
#   ※ 이 fold는 '증권 전용' 격리 프로파일이라 안전 — 일반 프로파일에서 fold가 부채비율을 오도하는 것과 달리,
#     증권 프로파일은 부채비율·유동비율·이자보상배율을 애초에 제외하므로 fold가 왜곡을 만들지 않는다.
#   ※ cosmetic: Excel '주요 금액' 행 라벨이 '매출액'으로 뜨지만 값은 영업수익(비율 라벨은 '÷영업수익'로 정확).
#
# ⚠️ seed — 실제 증권사 수집 데이터로 검증하며 보강할 것(회사·연도 표기 흔들림). 미매칭은 ⚠️로 표면화.

aliases:
  # ── 손익계산서(증권) ── 영업수익을 '매출액' 표준명으로 fold(매출원가는 매핑 안 함)
  매출액:        [매출액, 영업수익, "영업수익(매출액)", 영업수익및영업외수익, 수익]
  영업이익:      [영업이익, "영업이익(손실)", 영업손익]
  당기순이익:    [당기순이익, "당기순이익(손실)", 분기순이익, 반기순이익, 연결당기순이익, "당기순이익(손실)지배기업소유주지분"]
  판매비와관리비: [판매비와관리비, 판매관리비, 판매비와관리비계]
  # 세부 영업수익 항목(L1 비율 미사용 — 향후 믹스 분석 대비 seed)
  수수료수익:    [수수료수익, 수수료수익계, 수탁수수료]
  이자수익:      [이자수익]

  # ── 재무상태표 ──
  자산총계:      [자산총계]
  부채총계:      [부채총계]
  자본총계:      [자본총계, "자본총계(지배+비지배)", 자본]

# 매칭 정책(analyze.py): 정확 일치 → 공백·괄호 제거 후 재시도 → 실패 시 '계산 불가(⚠️)'. 임의 추정 금지.
